name: C/C++ CI

on: [push, pull_request]

jobs:
  release-smoke:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Run benchmarks with Optimization
      run: |
        sudo apt-get update
        sudo apt-get install -y ninja-build libboost-dev
        cmake -G Ninja -B build -S . -DCMAKE_BUILD_TYPE=Release \
          -DCMAKE_CXX_FLAGS="-Wno-interference-size"
        cmake --build build
        ./build/SPSCQueueBenchmark

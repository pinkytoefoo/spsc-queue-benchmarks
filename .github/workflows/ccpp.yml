name: C/C++ CI

on: [push]

jobs:
  build-ubuntu:

    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v1
    - name: Build & Benchmark
      run: |
        sudo apt update
        sudo apt install ninja-build
        cmake -E remove_directory build
        cmake -G Ninja -B build -S . -DCMAKE_BUILD_TYPE=Debug -DCMAKE_CXX_FLAGS="-Wno-interference-size -fsanitize=address,undefined"
        cmake --build build
        cd build
        ninja
        ./SPSCQueueBenchmark
